<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>オートク | デビル CM</title>
  <style>
    :root {
      --ink: #10152b;
      --blue: #3158ff;
      --yellow: #ffd84d;
      --pink: #ff6f91;
      --sky: #bceaff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(160deg, #fff8df 0%, #d9f6ff 55%, #c7b9ff 100%);
    }
    .wrap { width: min(1120px, 92vw); margin: 0 auto; padding: 28px 0 42px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .brand { font-weight: 900; letter-spacing: .12em; font-size: clamp(1.3rem, 3vw, 2rem); }
    .brand span { color: var(--blue); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    button {
      border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 800;
      cursor: pointer; color: var(--ink); background: white; box-shadow: 0 7px 0 rgba(16,21,43,.13);
    }
    button.primary { color: white; background: var(--blue); }
    button:active { transform: translateY(3px); box-shadow: 0 4px 0 rgba(16,21,43,.13); }
    .hero { display: grid; grid-template-columns: 1fr 1.15fr; align-items: center; gap: 34px; padding: 46px 0 24px; }
    h1 { margin: 0 0 16px; font-size: clamp(2.6rem, 7vw, 6.8rem); line-height: .96; letter-spacing: -.08em; }
    h1 em { color: var(--blue); font-style: normal; }
    .lead { font-size: clamp(1rem, 2vw, 1.35rem); font-weight: 700; line-height: 1.8; }
    .note { display: inline-block; margin-top: 12px; padding: 8px 13px; border-radius: 12px; background: rgba(255,255,255,.62); font-size: .83rem; }
    .stage {
      position: relative; min-height: 590px; overflow: hidden; border-radius: 40px;
      background: linear-gradient(#8edfff 0%, #eafcff 57%, #8bd76d 57%, #4ca64d 100%);
      box-shadow: 0 22px 50px rgba(48,53,117,.2); isolation: isolate;
    }
    .cloud { position: absolute; width: 140px; height: 34px; border-radius: 50px; background: rgba(255,255,255,.72); filter: blur(1px); }
    .cloud:before, .cloud:after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
    .cloud:before { width: 60px; height: 60px; left: 22px; bottom: 0; }
    .cloud:after { width: 75px; height: 75px; left: 65px; bottom: 0; }
    .c1 { top: 76px; left: 8%; transform: scale(.8); }.c2 { top: 180px; right: 4%; transform: scale(.65); }
    .tree { position: absolute; z-index: 1; bottom: -7px; left: 50%; width: 280px; height: 240px; transform: translateX(-50%); }
    .trunk { position: absolute; bottom: 0; left: 119px; width: 48px; height: 190px; border-radius: 25px; background: #8d552f; }
    .leaf { position: absolute; border-radius: 50%; background: #258d52; box-shadow: inset -15px -10px 0 #197343; }
    .l1 { width: 170px; height: 150px; left: 4px; top: 30px; }.l2 { width: 150px; height: 138px; right: 2px; top: 23px; }
    .l3 { width: 150px; height: 150px; left: 65px; top: -25px; background: #35aa5e; }
    .falling { position: absolute; z-index: 4; left: 50%; top: -120px; width: 120px; height: 160px; transform: translateX(-50%); opacity: 0; }
    .falling .person { position: absolute; width: 42px; height: 76px; border-radius: 24px 24px 12px 12px; background: var(--pink); }
    .falling .person:before { content: ""; position: absolute; width: 34px; height: 34px; top: -33px; left: 4px; border-radius: 50%; background: #ffd6b5; }
    .falling .p1 { left: 5px; top: 55px; transform: rotate(-18deg); background: #ff7b55; }
    .falling .p2 { right: 5px; top: 45px; transform: rotate(17deg); background: #7c6cff; }
    .phone { position: absolute; z-index: 3; left: 50%; top: 180px; width: 220px; height: 360px; transform: translateX(-50%) rotate(-5deg); border: 12px solid #14172a; border-radius: 30px; background: #090b18; box-shadow: 0 20px 30px rgba(21,46,74,.3); }
    .phone:before { content: ""; position: absolute; left: 50%; top: 7px; width: 68px; height: 8px; border-radius: 10px; transform: translateX(-50%); background: #252943; }
    .screen { position: absolute; inset: 18px 10px 10px; border-radius: 17px; overflow: hidden; background: linear-gradient(140deg, #fff1a4, #ff86ad 49%, #6d79ff); display: grid; place-items: center; text-align: center; padding: 18px; }
    .screen .mini { font-size: 1.05rem; font-weight: 900; color: white; text-shadow: 0 2px 6px #28265e; }
    .screen .mini b { display: block; font-size: 2.5rem; color: #fff; }
    .device { position: absolute; z-index: 5; top: 22px; right: 20px; width: 112px; filter: drop-shadow(0 8px 6px rgba(0,0,0,.2)); }
    .caption { position: absolute; z-index: 6; left: 18px; right: 18px; bottom: 18px; text-align: center; color: white; font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.35rem); text-shadow: 0 3px 4px #1c3e45; opacity: 0; transition: opacity .25s; }
    .caption.show { opacity: 1; }
    .stage.playing .falling { animation: drop 8s cubic-bezier(.2,.8,.32,1) forwards; }
    @keyframes drop { 0% { top: -120px; opacity: 1; transform: translateX(-50%) rotate(0); } 72% { top: 310px; opacity: 1; transform: translateX(-50%) rotate(360deg); } 86% { top: 365px; opacity: 1; transform: translateX(-50%) rotate(390deg) scale(.8); } 100% { top: 330px; opacity: 0; transform: translateX(-50%) rotate(390deg) scale(.7); } }
    .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 22px; }
    .card { padding: 18px; border-radius: 20px; background: rgba(255,255,255,.7); font-weight: 800; }
    .card strong { display: block; margin-bottom: 5px; color: var(--blue); font-size: 1.25rem; }
    @media (max-width: 760px) { .hero { grid-template-columns: 1fr; padding-top: 30px; } .stage { min-height: 540px; } .details { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } .actions { justify-content: flex-start; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">架空CM / <span>オートク</span></div>
      <div class="actions">
        <button class="primary" id="play">▶ CMを再生</button>
        <button id="download">↓ CMページをダウンロード</button>
      </div>
    </header>
    <section class="hero">
      <div>
        <h1>お得に、<br><em>落ちる。</em></h1>
        <p class="lead">オートクの新ゲーム機「デビル」。<br>どんな時でも、楽しいを止めない。</p>
        <span class="note">※このCMは架空の演出です。安全な場所でお楽しみください。</span>
      </div>
      <div class="stage" id="stage" aria-label="オートクの架空CMステージ">
        <div class="cloud c1"></div><div class="cloud c2"></div>
        <img class="device" src="assets/devil-console.svg" alt="ゲーム機デビル">
        <div class="falling"><span class="person p1"></span><span class="person p2"></span></div>
        <div class="phone"><div class="screen"><div class="mini">オートク<b>デビル</b>CM</div></div></div>
        <div class="tree"><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="trunk"></div></div>
        <div class="caption" id="caption">オートク</div>
      </div>
    </section>
    <section class="details">
      <div class="card"><strong>いつでもお得</strong>会員は5,000円割引</div>
      <div class="card"><strong>どこでも楽しい</strong>落ちてる時でも楽しめる</div>
      <div class="card"><strong>デビル</strong>25,000円 / 50g</div>
    </section>
  </main>
  <script>
    const stage = document.querySelector("#stage");
    const caption = document.querySelector("#caption");
    const play = document.querySelector("#play");
    let audioContext;
    function voice(text, delay) {
      setTimeout(() => {
        if (!("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ja-JP"; utterance.rate = .92; utterance.pitch = 1.18; utterance.volume = 1;
        speechSynthesis.speak(utterance);
      }, delay);
    }
    function music() {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25];
      notes.forEach((note, i) => {
        const osc = audioContext.createOscillator(), gain = audioContext.createGain();
        osc.type = "triangle"; osc.frequency.value = note;
        gain.gain.setValueAtTime(.0001, audioContext.currentTime + i * .18);
        gain.gain.exponentialRampToValueAtTime(.09, audioContext.currentTime + i * .18 + .03);
        gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + i * .18 + .17);
        osc.connect(gain).connect(audioContext.destination); osc.start(audioContext.currentTime + i * .18); osc.stop(audioContext.currentTime + i * .18 + .2);
      });
    }
    function start() {
      stage.classList.remove("playing"); void stage.offsetWidth; stage.classList.add("playing");
      caption.classList.add("show"); caption.textContent = "オートク";
      music(); voice("オートク", 200);
      voice("お得なオートクはいつでもお得、そして落ちてる時でも楽しめる。", 1250);
      voice("あなたも一緒にお得に買おう。会員は五千円割引。", 4300);
      voice("お得なオートク！", 6500);
      setTimeout(() => { caption.textContent = "お得なオートク！"; }, 6400);
      setTimeout(() => { caption.classList.remove("show"); }, 7800);
    }
    play.addEventListener("click", start);
    document.querySelector("#download").addEventListener("click", () => {
      const html = "<!doctype html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "autoku-devil-cm.html"; link.click();
      URL.revokeObjectURL(link.href);
    });
  </script>
</body>
</html>
